[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "riskshield-ml"
version = "1.1.0"
description = "Reproducible transaction fraud scoring and risk decisioning simulation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "pandas==2.3.1", "scipy==1.16.1", "scikit-learn==1.7.1", "xgboost==3.0.4", "fastapi==0.116.1", "pydantic==2.11.7", "uvicorn==0.35.0", "joblib==1.5.1"]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.9"]
tracking = ["mlflow-skinny==3.1.4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
riskshield = ["config/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
