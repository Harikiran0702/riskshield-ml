services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RISKSHIELD_API_KEY: ${RISKSHIELD_API_KEY:?Set a key of at least 24 characters}
      RISKSHIELD_DATABASE: /app/state/service.sqlite3
    volumes:
      - audit:/app/state
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  audit:
